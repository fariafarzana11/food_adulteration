<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Food Adulteration ML{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2933; --muted:#6b7280; --accent:#2f7d4f; --warn:#b45309; --border:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:14px 24px; display:flex; gap:24px; align-items:center; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header a { color:#fff; text-decoration:none; opacity:.9; }
  header a:hover { opacity:1; text-decoration:underline; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:20px; }
  .notice { background:#fffbeb; border:1px solid #fcd34d; color:#78350f; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  select, input, button { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:600; margin-top:12px; }
  button:hover { filter:brightness(1.08); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); }
  .bar { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .small { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Food Adulteration Analyzer</h1>
  <a href="/">Predict</a>
  <a href="/dashboard">Dashboard</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
